name: SAMplay iOS IPA
on:
  push:
    branches: [main, wip-p2]
    paths-ignore: ['PROGRESS_IOS.md']
  workflow_dispatch:
    inputs:
      configuration:
        description: Release or Debug
        type: choice
        options: [Release, Debug]
        default: Release
concurrency:
  group: samplay-ios-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      IOS_CONFIGURATION: ${{ inputs.configuration || 'Release' }}
      GRADLE_OPTS: -Dfile.encoding=UTF-8
      KOTLIN_DAEMON_JVMARGS: -Xmx2048M
      NUVIO_GRADLE_JVMARGS: -Xmx4608M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=768M
      NUVIO_KOTLIN_NATIVE_JVMARGS: -Xmx4608M
      RUNTIME_PROPERTIES_BASE64: ${{ secrets.SAMPLAY_LOCAL_PROPERTIES_BASE64 }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Cache Kotlin Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-${{ runner.arch }}-
      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -v beta | sort -V | tail -1)
          [ -n "$X" ] && sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Runtime properties (from secret, never committed)
        if: env.RUNTIME_PROPERTIES_BASE64 != ''
        run: printf '%s' "$RUNTIME_PROPERTIES_BASE64" | base64 --decode > local.properties
      - name: Build unsigned IPA
        run: |
          ( while sleep 120; do echo "::group::resources $(date -u +%H:%M:%S)"; uptime; vm_stat | head -6; echo "::endgroup::"; done ) &
          trap 'kill $! 2>/dev/null || true' EXIT
          ./scripts/build_unsigned_ipa.sh
      - name: Unit tests (iOS simulator)
        run: ./gradlew :composeApp:iosSimulatorArm64Test --tests "com.nuvio.app.features.ai.*" --tests "com.nuvio.app.features.player.SamplayPlayerIosTest" --tests "com.nuvio.app.features.reshaped.*" --no-daemon
      - name: Remove secrets
        if: always()
        run: rm -f local.properties
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SAMplay-iOS-ipa
          path: |
            build/*.ipa
            build/verify.txt
            build/xcodebuild.log
            composeApp/build/reports/tests/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cinterop-klibs
          path: |
            build/cinterop/
          if-no-files-found: warn
